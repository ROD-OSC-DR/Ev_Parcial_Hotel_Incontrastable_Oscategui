services:
  - type: web
    name: hotel-incontrastable-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/salud
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080

  - type: web
    name: hotel-incontrastable-web
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: hotel-incontrastable-api
          envVarKey: RENDER_EXTERNAL_URL
